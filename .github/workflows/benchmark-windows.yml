name: Offline benchmark (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run offline benchmark gate
        run: python tests/tools/run_gate.py "windows-${{ github.run_id }}"
